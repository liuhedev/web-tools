<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>视频提取图片 · 刘贺的小工具</title>
  <link rel="stylesheet" href="../workbench.css">
  <script src="../vendor/fflate.js" defer></script>
  <script type="module" src="./video.js"></script>
</head>
<body>
  <main>
    <nav aria-label="导航"><a href="../">← 小工具</a></nav>
    <header>
      <h1>视频提取图片</h1>
      <p>从视频按时间间隔截取画面。视频在浏览器里处理，图片可单张或打包下载。</p>
    </header>
    <form id="form">
      <div class="field">
        <label for="video">选择视频</label>
        <input id="video" type="file" accept="video/*,.mp4,.mov,.webm" required aria-describedby="video-help">
        <p id="video-help" class="hint">视频需能在当前浏览器播放，例如 H.264 编码的 MP4。</p>
      </div>
      <div class="field">
        <label for="interval">提取间隔（秒）</label>
        <input id="interval" type="number" min="0.1" step="any" value="1" required>
      </div>
      <label><input id="deduplicate" type="checkbox"> 跳过相似画面</label>
      <div class="actions"><button id="run" type="submit">提取图片</button><button id="cancel" type="button" hidden>停止提取</button></div>
      <progress id="progress" aria-label="提取进度" hidden></progress>
    </form>
    <p id="status" class="status" role="status"></p>
    <section id="results" class="results" aria-labelledby="results-heading" hidden>
      <header><h2 id="results-heading">提取结果</h2><button id="zip" type="button">下载 ZIP</button></header>
      <ol id="frames" class="frames"></ol>
    </section>
  </main>
</body>
</html>
